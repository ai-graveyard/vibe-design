name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Reference consistency tests
        run: pnpm test

      # 只构建与整理发布目录，不调用 Cloudflare，也不需要部署凭证。
      - name: Build Cloudflare assets
        run: pnpm build:cloudflare

      - name: Skill 产物已同步
        run: git diff --exit-code -- skills public/skill.md public/markdown public/llms.txt public/llms-full.txt

      - name: Browser smoke tests
        if: github.event_name == 'pull_request'
        run: pnpm validate:smoke

      - name: Upload smoke test evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: vibe-design-smoke
          path: output/smoke/
          if-no-files-found: ignore
          retention-days: 7
