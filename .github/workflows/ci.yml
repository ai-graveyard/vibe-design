name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # ≥22.6：build-skill.mjs 直接 import src/data/*.ts，依赖内置类型擦除
          node-version: 22.18
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Reference consistency tests
        run: pnpm test

      # build 内含数据一致性校验（validate-demos）、skill 产物生成、tsc、vite build 与 SEO 后处理
      - name: Build
        run: pnpm build

      - name: Studio viewport and embedded interaction tests
        run: pnpm validate:studio

      - name: Project handoff, same-content comparison and evidence tests
        run: pnpm validate:workflow

      - name: Recipe, download and offline interaction tests
        run: pnpm validate:recipes

      - name: Four-viewport visual gates and local demo interactions
        run: pnpm visual

      # headless Chrome 打开每个 demo，断言 375px 视口无横向滚动（checklist「Layout」第一条）
      - name: Demo 375px 渲染校验
        run: pnpm validate:render

      - name: Upload visual review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibe-design-visual-review
          path: |
            output/visual/
            output/studio/
            output/workflow/
            output/recipes/
            output/render/
          retention-days: 14

      # 改了 src/data 却忘了提交重建后的 skills/ 或 public/skill.md，在这里红
      - name: Skill 产物已同步
        run: git diff --exit-code -- skills public/skill.md public/markdown public/llms.txt public/llms-full.txt
